id: upsell_conversion
title: "RENT-TO-TRY-THEN-BUY: THE BUSINESS MODEL FIRING"
subtitle: "Three tile-saw rentals plus a dust extractor, then a financed purchase"
seed: world
clock_start_utc: "2026-03-01T08:00:00Z"
premise: >
  Tobias is a sole trader doing tiling jobs. He rents the same tile saw three
  times over three months, and once rents the dust extractor that goes with it.
  Each of the three upsell signals is an integer comparison against a threshold
  in a YAML file: cumulative spend past 60 percent of the purchase price, three
  repeat rentals of the same item, and both halves of a declared complementary
  pair. All three fire. The rent he already paid is credited against the price
  and the remainder is split into instalments.

script:
  - show: item
    item: "@tilesaw"

  - note: "----- rental 1 -----"
  - cmd: ReserveItem
    actor: renter
    label: "Rental 1: reservation"
    as: r1
    args:
      item_id: "@tilesaw"
      renter_handle: tobi
      window_start_utc: "2026-03-02T08:00:00Z"
      window_end_utc: "2026-03-09T08:00:00Z"
  - cmd: GrantAccess
    actor: system
    label: "Rental 1: Platform issues the access credential"
    args: {rental_id: "@r1"}
  - advance_to: "2026-03-02T09:00:00Z"
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 1: pre-rental condition report"
    args:
      rental_id: "@r1"
      phase: pre
      submitted_by_handle: tobi
      damage_tags: []
      photo_descriptors:
        front: "run 1: saw body"
        serial_plate: "SN-TIL-0005"
        working_surface: "run 1: blade and water tray"
  - cmd: OpenLockbox
    actor: renter
    label: "Rental 1: Credential presented, item collected"
    args: {rental_id: "@r1"}
  - advance_to: "2026-03-08T17:00:00Z"
  - cmd: ReturnItem
    actor: renter
    label: "Rental 1: item returned"
    args: {rental_id: "@r1"}
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 1: post-rental condition report"
    args:
      rental_id: "@r1"
      phase: post
      submitted_by_handle: tobi
      damage_tags: []
      photo_descriptors:
        front: "run 1: saw body"
        serial_plate: "SN-TIL-0005"
        working_surface: "run 1: blade and water tray"
  - cmd: AcceptReturn
    actor: system
    label: "Rental 1: return accepted and settled"
    args: {rental_id: "@r1"}

  - note: "----- rental 2 -----"
  - cmd: ReserveItem
    actor: renter
    label: "Rental 2: reservation"
    as: r2
    args:
      item_id: "@tilesaw"
      renter_handle: tobi
      window_start_utc: "2026-04-06T08:00:00Z"
      window_end_utc: "2026-04-13T08:00:00Z"
  - cmd: GrantAccess
    actor: system
    label: "Rental 2: Platform issues the access credential"
    args: {rental_id: "@r2"}
  - advance_to: "2026-04-06T09:00:00Z"
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 2: pre-rental condition report"
    args:
      rental_id: "@r2"
      phase: pre
      submitted_by_handle: tobi
      damage_tags: [blade_dull]
      photo_descriptors:
        front: "run 2: saw body"
        serial_plate: "SN-TIL-0005"
        working_surface: "run 2: blade and water tray"
  - cmd: OpenLockbox
    actor: renter
    label: "Rental 2: Credential presented, item collected"
    args: {rental_id: "@r2"}
  - advance_to: "2026-04-12T17:00:00Z"
  - cmd: ReturnItem
    actor: renter
    label: "Rental 2: item returned"
    args: {rental_id: "@r2"}
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 2: post-rental condition report"
    args:
      rental_id: "@r2"
      phase: post
      submitted_by_handle: tobi
      damage_tags: [blade_dull]
      photo_descriptors:
        front: "run 2: saw body"
        serial_plate: "SN-TIL-0005"
        working_surface: "run 2: blade and water tray"
  - cmd: AcceptReturn
    actor: system
    label: "Rental 2: return accepted and settled"
    args: {rental_id: "@r2"}

  - note: "----- rental 3 -----"
  - cmd: ReserveItem
    actor: renter
    label: "Rental 3: reservation"
    as: r3
    args:
      item_id: "@tilesaw"
      renter_handle: tobi
      window_start_utc: "2026-05-11T08:00:00Z"
      window_end_utc: "2026-05-18T08:00:00Z"
  - cmd: GrantAccess
    actor: system
    label: "Rental 3: Platform issues the access credential"
    args: {rental_id: "@r3"}
  - advance_to: "2026-05-11T09:00:00Z"
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 3: pre-rental condition report"
    args:
      rental_id: "@r3"
      phase: pre
      submitted_by_handle: tobi
      damage_tags: [blade_dull]
      photo_descriptors:
        front: "run 3: saw body"
        serial_plate: "SN-TIL-0005"
        working_surface: "run 3: blade and water tray"
  - cmd: OpenLockbox
    actor: renter
    label: "Rental 3: Credential presented, item collected"
    args: {rental_id: "@r3"}
  - advance_to: "2026-05-17T17:00:00Z"
  - cmd: ReturnItem
    actor: renter
    label: "Rental 3: item returned"
    args: {rental_id: "@r3"}
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 3: post-rental condition report"
    args:
      rental_id: "@r3"
      phase: post
      submitted_by_handle: tobi
      damage_tags: [blade_dull]
      photo_descriptors:
        front: "run 3: saw body"
        serial_plate: "SN-TIL-0005"
        working_surface: "run 3: blade and water tray"
  - cmd: AcceptReturn
    actor: system
    label: "Rental 3: return accepted and settled"
    args: {rental_id: "@r3"}

  - note: >
      A tiling job needs extraction. He rents the other half of the pair, which
      is the third signal.

  - note: "----- rental 4 -----"
  - cmd: ReserveItem
    actor: renter
    label: "Rental 4: reservation"
    as: r4
    args:
      item_id: "@extractor"
      renter_handle: tobi
      window_start_utc: "2026-05-20T08:00:00Z"
      window_end_utc: "2026-05-23T08:00:00Z"
  - cmd: GrantAccess
    actor: system
    label: "Rental 4: Platform issues the access credential"
    args: {rental_id: "@r4"}
  - advance_to: "2026-05-20T09:00:00Z"
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 4: pre-rental condition report"
    args:
      rental_id: "@r4"
      phase: pre
      submitted_by_handle: tobi
      damage_tags: []
      photo_descriptors:
        front: "hose coiled"
        in_place_wide: "bay 3, extractor in place"
        landmark: "blue tarp, third pallet"
        working_surface: "filter bag seated"
  - cmd: OpenLockbox
    actor: renter
    label: "Rental 4: Credential presented, item collected"
    args: {rental_id: "@r4"}
  - advance_to: "2026-05-22T17:00:00Z"
  - cmd: ReturnItem
    actor: renter
    label: "Rental 4: item returned"
    args: {rental_id: "@r4"}
  - cmd: SubmitConditionReport
    actor: renter
    label: "Rental 4: post-rental condition report"
    args:
      rental_id: "@r4"
      phase: post
      submitted_by_handle: tobi
      damage_tags: []
      photo_descriptors:
        front: "hose coiled"
        in_place_wide: "bay 3, extractor in place"
        landmark: "blue tarp, third pallet"
        working_surface: "filter bag seated"
  - cmd: AcceptReturn
    actor: system
    label: "Rental 4: return accepted and settled"
    args: {rental_id: "@r4"}

  - note: >
      Now ask the engine what it thinks. Nothing was inferred along the way: this
      is a fold over closed rentals against three integer thresholds.
  - cmd: DetectPurchaseOpportunity
    actor: system
    label: "Evaluate purchase intent for the tile saw"
    as: offer1
    args: {renter_handle: tobi, item_id: "@tilesaw"}
  - show: offers
  - cmd: AcceptPurchaseOffer
    actor: renter
    label: "Tobias buys the saw on 6 monthly instalments"
    args: {offer_id: "@offer1", term_months: 6}
  - show: item
    item: "@tilesaw"
  - show: trust
    user: tobi
