# sim/seed/world.yaml
# Fixed seed world. Committed, versioned, and byte-stable: every scenario starts
# from exactly this state, which is half of what makes runs reproducible (the
# other half is the FixedClock start time each scenario declares).
#
# `ref` is a human-readable handle used by scenario scripts. Real ids are
# content hashes derived at load time, so they too are identical on every run.

