# damage_taxonomy.yaml
# L0 RULESET — The closed damage vocabulary.
#
# Photos are EVIDENCE attached to a structured claim. They are never a decision
# input: no model looks at them, and no rule below reads a pixel. A condition
# report is a set of tag_ids drawn from this file plus photo slot references.
# Anything a renter cannot express with a tag here goes to a human, tagged
# `other_requires_human`, which is the single escape hatch and always routes out
# of the automated path.

ruleset_version: 2
schema: damage_taxonomy/1

severity_scale:
  cosmetic:   {rank: 1, blocks_next_rental: false, description: "Visible, does not affect function or value materially."}
  minor:      {rank: 2, blocks_next_rental: false, description: "Affects finish or comfort; item still fully usable."}
  major:      {rank: 3, blocks_next_rental: true,  description: "Affects function, safety, or completeness."}
  critical:   {rank: 4, blocks_next_rental: true,  description: "Item unusable or unsafe."}

# Component scope lets the diff group findings. Ordered by component_id in every
# output (precedence.yaml:sort_keys.damage_findings).
components:
  - {component_id: body,        label: "Housing / frame / body"}
  - {component_id: surface,     label: "Working surface / blade / drum"}
  - {component_id: power,       label: "Battery, motor, cable, fuel system"}
  - {component_id: control,     label: "Switches, display, electronics"}
  - {component_id: optics,      label: "Lenses, screens, sensors"}
  - {component_id: accessory,   label: "Detachable parts and consumables"}
  - {component_id: docs,        label: "Manual, certificate, inspection sticker"}
  - {component_id: cleanliness, label: "Contamination, residue, fuel level"}
  - {component_id: unscoped,    label: "Not attributable to a component"}

tags:
  - {tag_id: scratch_minor,        component: body,        severity: cosmetic, repair_cost_band: none,   label: "Minor scratch"}
  - {tag_id: scuff_paint,          component: body,        severity: cosmetic, repair_cost_band: none,   label: "Paint scuffed"}
  - {tag_id: dent_minor,           component: body,        severity: minor,    repair_cost_band: low,    label: "Small dent"}
  - {tag_id: dent_major,           component: body,        severity: major,    repair_cost_band: medium, label: "Major dent / deformation"}
  - {tag_id: crack_housing,        component: body,        severity: major,    repair_cost_band: medium, label: "Cracked housing"}
  - {tag_id: blade_dull,           component: surface,     severity: minor,    repair_cost_band: low,    label: "Blade or abrasive worn"}
  - {tag_id: blade_chipped,        component: surface,     severity: major,    repair_cost_band: medium, label: "Blade chipped or bent"}
  - {tag_id: surface_gouged,       component: surface,     severity: major,    repair_cost_band: medium, label: "Working surface gouged"}
  - {tag_id: battery_degraded,     component: power,       severity: minor,    repair_cost_band: low,    label: "Battery holds reduced charge"}
  - {tag_id: cable_frayed,         component: power,       severity: major,    repair_cost_band: low,    label: "Cable or hose frayed"}
  - {tag_id: motor_noise,          component: power,       severity: major,    repair_cost_band: high,   label: "Abnormal motor noise"}
  - {tag_id: fluid_leak,           component: power,       severity: critical, repair_cost_band: high,   label: "Fuel, oil or hydraulic leak"}
  - {tag_id: will_not_start,       component: power,       severity: critical, repair_cost_band: high,   label: "Does not start"}
  - {tag_id: switch_faulty,        component: control,     severity: major,    repair_cost_band: medium, label: "Switch or trigger faulty"}
  - {tag_id: display_dead,         component: control,     severity: major,    repair_cost_band: medium, label: "Display or indicator dead"}
  - {tag_id: safety_guard_missing, component: control,     severity: critical, repair_cost_band: low,    label: "Safety guard or interlock missing"}
  - {tag_id: lens_scratched,       component: optics,      severity: major,    repair_cost_band: high,   label: "Lens or screen scratched"}
  - {tag_id: sensor_dust,          component: optics,      severity: minor,    repair_cost_band: low,    label: "Dust on sensor or optics"}
  - {tag_id: missing_accessory,    component: accessory,   severity: major,    repair_cost_band: low,    label: "Listed accessory missing"}
  - {tag_id: accessory_damaged,    component: accessory,   severity: minor,    repair_cost_band: low,    label: "Accessory damaged"}
  - {tag_id: consumable_depleted,  component: accessory,   severity: cosmetic, repair_cost_band: none,   label: "Consumable used up"}
  - {tag_id: manual_missing,       component: docs,        severity: minor,    repair_cost_band: none,   label: "Manual missing"}
  - {tag_id: certificate_expired,  component: docs,        severity: critical, repair_cost_band: none,   label: "Inspection certificate expired"}
  - {tag_id: returned_dirty,       component: cleanliness, severity: minor,    repair_cost_band: low,    label: "Returned soiled"}
  - {tag_id: fuel_not_refilled,    component: cleanliness, severity: minor,    repair_cost_band: low,    label: "Fuel or consumable not replenished"}
  - {tag_id: other_requires_human, component: unscoped,    severity: major,    repair_cost_band: unknown, label: "Not expressible as a tag - escalate to a human"}

repair_cost_bands:
  none:    {band_index: 0, deposit_hold_cents: 0}
  low:     {band_index: 1, deposit_hold_cents: 2500}
  medium:  {band_index: 2, deposit_hold_cents: 12000}
  high:    {band_index: 3, deposit_hold_cents: 45000}
  unknown: {band_index: 4, deposit_hold_cents: 12000}

# Tags that, when NEWLY appearing on a return report, force item -> damage_hold
# rather than item -> available. Derived from severity.blocks_next_rental, listed
# explicitly so the rule is greppable and auditable.
blocking_on_new_appearance:
  - dent_major
  - crack_housing
  - blade_chipped
  - surface_gouged
  - cable_frayed
  - motor_noise
  - fluid_leak
  - will_not_start
  - switch_faulty
  - display_dead
  - safety_guard_missing
  - lens_scratched
  - missing_accessory
  - certificate_expired
  - other_requires_human
